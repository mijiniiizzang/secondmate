<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="chatPanel" sec:authorize="hasRole('USER')">
    <link rel="stylesheet" th:href="@{/css/chat/chat-panel.css}">
    <link rel="stylesheet" th:href="@{/css/chat/chat-room-panel.css}">
    <link rel="stylesheet" th:href="@{/css/chat/chat-message-panel.css}">
    <link rel="stylesheet" th:href="@{/css/user/review-modal.css}">

    <aside id="chatPanel" hidden>

        <div th:replace="~{chat/chat-room-panel :: chatRoomPanel}"></div>
        <div th:replace="~{chat/chat-message-panel :: chatMessagePanel}"></div>

    </aside>

    <div th:replace="~{report/user-report :: userReport}"></div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script th:inline="javascript">
        const loginUserId =
            /*[[${#authentication.principal.userId}]]*/ 0;

        let stompClient = null;
        let selectedRoomId = null;
        let selectedOpponentUserId = null;
        let selectedOpponentNickname = null;

        function connectChatWebSocket() {
            const socket = new SockJS("/ws/chat");

            stompClient = Stomp.over(socket);

            stompClient.connect({}, function () {
                stompClient.subscribe("/user/queue/chat", function (response) {
                    const message = JSON.parse(response.body);

                    if (selectedRoomId === message.roomId) {
                        appendChatMessage(message);

                        if (message.senderId !== loginUserId) {
                            openChatRoom(selectedRoomId);
                        }

                        updateChatUnreadBadge();
                        return;
                    }

                    updateChatUnreadBadge();

                    const chatPanel =
                        document.getElementById("chatPanel");

                    const chatListView =
                        document.getElementById("chatListView");

                    if (!chatPanel.hidden && !chatListView.hidden) {
                        loadChatRooms();
                    }
                });

                stompClient.subscribe("/user/queue/chat-read", function (response) {
                    const readMessage = JSON.parse(response.body);

                    const unread = document.querySelector(
                        '.message-unread[data-message-id="' + readMessage.messageId + '"]'
                    );

                    if (unread) {
                        unread.remove();
                    }
                });
            });
        }

        function openChatPanel() {
            document.getElementById("chatPanel").hidden = false;

            showChatList();

            updateChatUnreadBadge();
        }

        function closeChatPanel() {
            document.getElementById("chatPanel").hidden = true;

            selectedRoomId = null;
            selectedOpponentUserId = null;
            selectedOpponentNickname = null;
        }

        function updateChatUnreadBadge() {
            fetch("/chat/api/unread-count")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("안 읽은 메시지 수 조회 실패");
                    }

                    return response.json();
                })
                .then(unreadCount => {
                    const chatUnreadBadge =
                        document.getElementById("chatUnreadBadge");

                    if (!chatUnreadBadge) {
                        return;
                    }

                    if (unreadCount > 0) {
                        chatUnreadBadge.textContent = unreadCount;
                        chatUnreadBadge.style.display = "inline";
                    } else {
                        chatUnreadBadge.style.display = "none";
                    }
                })
                .catch(() => {
                });
        }

        connectChatWebSocket();
        updateChatUnreadBadge();
    </script>

</th:block>

</html>
