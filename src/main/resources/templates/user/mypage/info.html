<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/user/info.css}">
    <link rel="stylesheet" th:href="@{/css/user/password-modal.css}">
    <link rel="stylesheet" th:href="@{/css/user/withdraw-modal.css}">
    <th:block th:replace="~{common/head :: commonHead}"></th:block>
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8d0f47ae6501392120a8bdcab71e77e4&libraries=services"></script>
    <title>회원정보 관리</title>
</head>

<body>
    <div th:replace="~{common/header :: header}"></div>

    <main class="info-container">
        <section class="info-content">
            <div class="info-page-header">
                <div>
                    <h1>내 회원정보</h1>
                    <p class="info-intro">회원정보를 조회·수정할 수 있습니다.</p>
                </div>

                <div class="info-header-button-area">
                    <button type="button" id="editBtn" class="info-header-btn">회원정보 수정</button>
                    <button type="button" id="passwordModalBtn" class="info-header-btn password-btn">비밀번호 변경</button>
                    <button type="submit" id="saveBtn" class="info-submit-btn" style="display: none;">저장</button>
                </div>
            </div>

            <form class="info-form" th:action="@{/mypage/info}" method="POST" id="getPhone">
                <div class="info-form-row">
                    <label>아이디</label>
                    <input type="text" th:value="${user.username}" readonly>
                </div>

                <div class="info-form-row">
                    <label>이름</label>
                    <input type="text" th:value="${user.name}" readonly>
                </div>

                <div class="info-form-row">
                    <label>닉네임</label>
                    <input type="text" id="nickname" name="nickname" th:value="${user.nickname}" readonly>
                    <span id="nicknameMsg" class="form-msg"></span>
                </div>

                <div class="info-form-row">
                    <label>전화번호</label>
                    <input type="text" id="phone1" name="phone1"
                        th:value="${user.phone != null ? #strings.arraySplit(user.phone, '-')[0] : ''}" maxlength="3"
                        readonly>
                    <span>-</span>
                    <input type="text" id="phone2" name="phone2"
                        th:value="${user.phone != null ? #strings.arraySplit(user.phone, '-')[1] : ''}" maxlength="4"
                        readonly>
                    <span>-</span>
                    <input type="text" id="phone3" name="phone3"
                        th:value="${user.phone != null ? #strings.arraySplit(user.phone, '-')[2] : ''}" maxlength="4"
                        readonly>
                    <input type="hidden" id="phone" name="phone">
                </div>

                <div class="info-form-row">
                    <label>이메일</label>
                    <input type="email" id="email" name="email" th:value="${user.email}" readonly>
                </div>

                <div class="info-form-row">
                    <label>거래 희망 지역</label>
                    <select id="city" name="city" disabled onchange="changeGu()">
                        <option value="">시/도 선택</option>
                        <option value="서울특별시">서울특별시</option>
                        <option value="부산광역시">부산광역시</option>
                        <option value="대구광역시">대구광역시</option>
                        <option value="인천광역시">인천광역시</option>
                        <option value="광주광역시">광주광역시</option>
                        <option value="대전광역시">대전광역시</option>
                        <option value="울산광역시">울산광역시</option>
                        <option value="세종특별자치시">세종특별자치시</option>
                        <option value="경기도">경기도</option>
                        <option value="강원도">강원도</option>
                        <option value="충청북도">충청북도</option>
                        <option value="충청남도">충청남도</option>
                        <option value="전라북도">전라북도</option>
                        <option value="전라남도">전라남도</option>
                        <option value="경상북도">경상북도</option>
                        <option value="경상남도">경상남도</option>
                        <option value="제주도">제주도</option>
                    </select>

                    <select id="gu" name="gu" disabled onchange="setAddress()">
                        <option value="">구/군 선택</option>
                    </select>
                </div>
                <label>거래 위치</label>
                <div id="map"></div>
                <input type="hidden" id="longitude" name="longitude" th:value="${user.longitude}">
                <input type="hidden" id="latitude" name="latitude" th:value="${user.latitude}">
                <input type="hidden" id="address" name="address" th:value="${user.address}">

                <button type="button" id="withdrawModalBtn" class="info-submit-btn">회원탈퇴</button>

            </form>
        </section>
    </main>
    <div th:replace="~{user/mypage/password-modal :: passwordModal}"></div>
    <div th:replace="~{user/mypage/withdraw-modal :: withdrawModal}"></div>
    <div th:replace="~{common/footer :: footer}"></div>

    <script th:inline="javascript">
        // 회원정보 수정
        let isEditing = false;

        document.getElementById("editBtn").addEventListener("click", function () {
            isEditing = true;

            document.getElementById("nickname").readOnly = false;
            document.getElementById("phone1").readOnly = false;
            document.getElementById("phone2").readOnly = false;
            document.getElementById("phone3").readOnly = false;
            document.getElementById("email").readOnly = false;

            document.getElementById("city").disabled = false;
            document.getElementById("gu").disabled = false;

            document.getElementById("editBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "inline-block";
        });

        // 닉네임 중복확인
        document.getElementById("nickname").addEventListener("keyup", function () {
            const nickname = this.value;
            const msg = document.getElementById("nicknameMsg");

            if (nickname.length < 1 || nickname === /*[[${user.nickname}*/'') {
                msg.innerText = "";
                return;
            }

            fetch("/mypage/info/check-nickname?nickname=" + encodeURIComponent(nickname))
                .then(res => res.text())
                .then(result => {
                    if (result === "true") {
                        msg.innerText = "이미 사용중인 닉네임입니다.";
                        msg.style.color = "red";
                    } else {
                        msg.innerText = "사용 가능한 닉네임입니다.";
                        msg.style.color = "green";
                    }
                });
        });

        // 전화번호 분리 + 합치기
        document.getElementById("getPhone").addEventListener("submit", function (event) {
            event.preventDefault();

            const phone1 = document.getElementById("phone1").value;
            const phone2 = document.getElementById("phone2").value;
            const phone3 = document.getElementById("phone3").value;

            document.getElementById("phone").value = phone1 + "-" + phone2 + "-" + phone3;

            const formData = new FormData(this);

            fetch("/mypage/info", {
                method: "POST",
                body: formData
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error();
                    }

                    alert("회원정보 수정 완료!");
                    location.href = "/mypage/info";
                })
                .catch(() => {
                    alert("회원정보 수정 실패");
                });
        });

        const areaData = {
            "서울특별시": [

                "광진구", "구로구", "금천구", "노원구", "도봉구",
                "동대문구", "동작구", "마포구", "서대문구", "서초구",
                "성동구", "성북구", "송파구", "양천구", "영등포구",
                "용산구", "은평구", "종로구", "중구", "중랑구"
            ],

            "부산광역시": [
                "강서구", "금정구", "기장군", "남구", "동구",
                "동래구", "부산진구", "북구", "사상구", "사하구",
                "서구", "수영구", "연제구", "영도구", "중구", "해운대구"
            ],

            "대구광역시": [
                "군위군", "남구", "달서구", "달성군", "동구",
                "북구", "서구", "수성구", "중구"
            ],

            "인천광역시": [
                "강화군", "계양구", "남동구", "동구", "미추홀구",
                "부평구", "서구", "연수구", "옹진군", "중구"
            ],

            "광주광역시": [
                "광산구", "남구", "동구", "북구", "서구"
            ],

            "대전광역시": [
                "대덕구", "동구", "서구", "유성구", "중구"
            ],

            "울산광역시": [
                "남구", "동구", "북구", "울주군", "중구"
            ],

            "세종특별자치시": [
                "세종특별자치시"
            ],

            "경기도": [
                "가평군", "고양시", "과천시", "광명시", "광주시",
                "구리시", "군포시", "김포시", "남양주시", "동두천시",
                "부천시", "성남시", "수원시", "시흥시", "안산시",
                "안성시", "안양시", "양주시", "양평군", "여주시",
                "연천군", "오산시", "용인시", "의왕시", "의정부시",
                "이천시", "파주시", "평택시", "포천시", "하남시", "화성시"
            ],

            "강원도": [
                "강릉시", "고성군", "동해시", "삼척시", "속초시",
                "양구군", "양양군", "영월군", "원주시", "인제군",
                "정선군", "철원군", "춘천시", "태백시", "평창군",
                "홍천군", "화천군", "횡성군"
            ],

            "충청북도": [
                "괴산군", "단양군", "보은군", "영동군", "옥천군",
                "음성군", "제천시", "증평군", "진천군", "청주시", "충주시"
            ],

            "충청남도": [

                "보령시", "부여군", "서산시", "서천군", "아산시",
                "예산군", "천안시", "청양군", "태안군", "홍성군"
            ],

            "전라북도": [
                "고창군", "군산시", "김제시", "남원시", "무주군",
                "부안군", "순창군", "완주군", "익산시", "임실군",
                "장수군", "전주시", "정읍시", "진안군"
            ],

            "전라남도": [
                "강진군", "고흥군", "곡성군", "광양시", "구례군",
                "나주시", "담양군", "목포시", "무안군", "보성군",
                "순천시", "신안군", "여수시", "영광군", "영암군",
                "완도군", "장성군", "장흥군", "진도군", "함평군",
                "해남군", "화순군"
            ],

            "경상북도": [
                "경산시", "경주시", "고령군", "구미시", "김천시",
                "문경시", "봉화군", "상주시", "성주군", "안동시",
                "영덕군", "영양군", "영주시", "영천시", "예천군",
                "울릉군", "울진군", "의성군", "청도군", "청송군",
                "칠곡군", "포항시"
            ],

            "경상남도": [
                "거제시", "거창군", "고성군", "김해시", "남해군",
                "밀양시", "사천시", "산청군", "양산시", "의령군",
                "진주시", "창녕군", "창원시", "통영시", "하동군",
                "함안군", "함양군", "합천군"
            ],

            "제주도": [
                "서귀포시", "제주시"
            ]
        };

        function changeGu() {
            const city = document.getElementById("city").value;
            const gu = document.getElementById("gu");

            gu.innerHTML = '<option value="">구/군 선택</option>';

            if (areaData[city]) {
                areaData[city].forEach(item => {
                    const option = document.createElement("option");
                    option.value = item;
                    option.textContent = item;
                    gu.appendChild(option);
                });
            }
        }

        const savedAddress = /*[[${user.address}]]*/'';

        if (savedAddress) {
            const addressParts = savedAddress.split(" ");

            document.getElementById("city").value = addressParts[0];
            changeGu();

            if (addressParts.length > 1) {
                document.getElementById("gu").value = addressParts[1];
            }
        }

        function setAddress() {
            const city = document.getElementById("city").value;
            const gu = document.getElementById("gu").value;

            let address = "";

            if (city === "세종특별자치시") {
                address = city;
            } else {
                address = city + " " + gu;
            }

            document.getElementById("address").value = address;

            geocoder.addressSearch(address, function (result, status) {
                if (status !== kakao.maps.services.Status.OK) {
                    alert("선택한 지역의 위치를 찾지 못했습니다.");
                    return;
                }

                const position = new kakao.maps.LatLng(
                    result[0].y,
                    result[0].x
                );

                map.setCenter(position);
                map.setLevel(6);

                if (marker) {
                    marker.setMap(null);
                }

                marker = new kakao.maps.Marker({
                    position: position
                });

                marker.setMap(map);

                document.getElementById("latitude").value = result[0].y;
                document.getElementById("longitude").value = result[0].x;
            });
        }

        // 지도에서 선택한 좌표 저장
        const savedLatitude = /*[[${user.latitude}]]*/null;
        const savedLongitude = /*[[${user.longitude}]]*/null;

        const mapContainer = document.getElementById("map");

        const mapCenter = savedLatitude && savedLongitude
            ? new kakao.maps.LatLng(savedLatitude, savedLongitude)
            : new kakao.maps.LatLng(37.566826, 126.9786567);

        const mapOption = {
            center: mapCenter,
            level: 5
        };

        const map = new kakao.maps.Map(mapContainer, mapOption);

        const geocoder = new kakao.maps.services.Geocoder();

        let marker;

        if (savedLatitude && savedLongitude) {
            marker = new kakao.maps.Marker({
                position: mapCenter
            });
            marker.setMap(map);
        }

        function normalizeCityName(city) {
            const cityNameMap = {
                "강원특별자치도": "강원도",
                "전북특별자치도": "전라북도",
                "제주특별자치도": "제주도"
            };

            return cityNameMap[city] || city;
        }

        function findMatchingGu(city, region2DepthName) {
            if (city === "세종특별자치시") {
                return "세종특별자치시";
            }

            if (!areaData[city] || !region2DepthName) {
                return "";
            }

            return areaData[city].find(function (gu) {
                return region2DepthName === gu
                    || region2DepthName.startsWith(gu + " ")
                    || region2DepthName.includes(gu);
            }) || "";
        }

        function updateRegionSelectByPosition(latlng) {
            const lat = latlng.getLat();
            const lng = latlng.getLng();

            geocoder.coord2RegionCode(lng, lat, function (result, status) {
                if (status !== kakao.maps.services.Status.OK || result.length === 0) {
                    alert("선택한 위치의 행정구역을 찾지 못했습니다.");
                    return;
                }

                const region = result.find(function (item) {
                    return item.region_type === "H";
                }) || result[0];

                const city = normalizeCityName(region.region_1depth_name);
                const gu = findMatchingGu(city, region.region_2depth_name);

                if (!areaData[city]) {
                    alert("선택한 위치의 시/도 정보를 목록에서 찾지 못했습니다.");
                    return;
                }

                const citySelect = document.getElementById("city");
                const guSelect = document.getElementById("gu");

                citySelect.value = city;
                changeGu();

                if (gu) {
                    guSelect.value = gu;
                }

                document.getElementById("address").value =
                    city === "세종특별자치시"
                        ? city
                        : city + " " + gu;
            });
        }

        kakao.maps.event.addListener(map, "click", function (mouseEvent) {
            if (!isEditing) {
                return;
            }

            const latlng = mouseEvent.latLng;

            document.getElementById("latitude").value = latlng.getLat();
            document.getElementById("longitude").value = latlng.getLng();

            if (marker) {
                marker.setMap(null);
            }

            marker = new kakao.maps.Marker({
                position: latlng
            });

            marker.setMap(map);

            updateRegionSelectByPosition(latlng);
        });
    </script>
</body>

</html>
