<th:block th:fragment="passwordModal">

    <div id="passwordModal" class="password-modal-wrapper">
        <div class="password-modal">
            <button type="button" id="passwordModalClose" class="password-modal-close">
                x
            </button>

            <h2>비밀번호 변경</h2>

            <form id="passwordChangeForm">
                <div class="password-form-row">
                    <label for="currentPassword">현재 비밀번호</label>
                    <input type="password" id="currentPassword" name="currentPassword" required>

                    <button type="button" id="checkCurrentPasswordBtn">
                        확인
                    </button>

                    <span id="curPasswordMsg" class="form-msg"></span>
                </div>

                <div class="password-form-row">
                    <label for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" name="newPassword" required disabled>
                </div>

                <div class="password-form-row">
                    <label for="newPasswordCheck">새 비밀번호 확인</label>
                    <input type="password" id="newPasswordCheck" name="newPasswordCheck" required disabled>
                    <span id="newPasswordCheckMsg" class="form-msg"></span>
                </div>

                <button type="submit" id="changePasswordBtn" class="password-change-submit-btn" disabled>
                    비밀번호 변경
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const passwordModal = document.getElementById("passwordModal");
            const passwordModalBtn = document.getElementById("passwordModalBtn");
            const passwordModalClose = document.getElementById("passwordModalClose");

            const passwordChangeForm = document.getElementById("passwordChangeForm");
            const currentPassword = document.getElementById("currentPassword");
            const newPassword = document.getElementById("newPassword");
            const newPasswordCheck = document.getElementById("newPasswordCheck");

            const checkCurrentPasswordBtn = document.getElementById("checkCurrentPasswordBtn");
            const changePasswordBtn = document.getElementById("changePasswordBtn");

            const curPasswordMsg = document.getElementById("curPasswordMsg");
            const newPasswordCheckMsg = document.getElementById("newPasswordCheckMsg");

            let isCurrentPasswordChecked = false;

            if (!passwordModal || !passwordModalBtn || !passwordModalClose || !passwordChangeForm) {
                return;
            }

            passwordModal.classList.remove("show");

            function resetPasswordModal() {
                passwordChangeForm.reset();

                isCurrentPasswordChecked = false;

                newPassword.disabled = true;
                newPasswordCheck.disabled = true;
                changePasswordBtn.disabled = true;

                curPasswordMsg.innerText = "";
                newPasswordCheckMsg.innerText = "";
            }

            function openPasswordModal() {
                resetPasswordModal();
                passwordModal.classList.add("show");
            }

            function closePasswordModal() {
                passwordModal.classList.remove("show");
                resetPasswordModal();
            }

            passwordModalBtn.addEventListener("click", openPasswordModal);

            passwordModalClose.addEventListener("click", closePasswordModal);

            passwordModal.addEventListener("click", function (event) {
                if (event.target === passwordModal) {
                    closePasswordModal();
                }
            });

            checkCurrentPasswordBtn.addEventListener("click", function () {
                if (!currentPassword.value.trim()) {
                    curPasswordMsg.innerText = "현재 비밀번호를 입력해주세요.";
                    curPasswordMsg.style.color = "red";
                    return;
                }

                const formData = new FormData();
                formData.append("currentPassword", currentPassword.value);

                fetch("/mypage/password/check", {
                    method: "POST",
                    body: formData
                })
                .then(response => {
                    if (response.status === 400) {
                        curPasswordMsg.innerText = "현재 비밀번호가 일치하지 않습니다.";
                        curPasswordMsg.style.color = "red";

                        isCurrentPasswordChecked = false;
                        newPassword.disabled = true;
                        newPasswordCheck.disabled = true;
                        changePasswordBtn.disabled = true;
                        return;
                    }

                    if (!response.ok) {
                        throw new Error();
                    }

                    curPasswordMsg.innerText = "현재 비밀번호가 확인되었습니다.";
                    curPasswordMsg.style.color = "green";

                    isCurrentPasswordChecked = true;
                    newPassword.disabled = false;
                    newPasswordCheck.disabled = false;
                    changePasswordBtn.disabled = false;

                    newPassword.focus();
                })
                .catch(() => {
                    alert("비밀번호 확인 중 오류가 발생했습니다.");
                });
            });

            passwordChangeForm.addEventListener("submit", function (event) {
                event.preventDefault();

                if (!isCurrentPasswordChecked) {
                    curPasswordMsg.innerText = "현재 비밀번호를 먼저 확인해주세요.";
                    curPasswordMsg.style.color = "red";
                    return;
                }

                if (!newPassword.value.trim()) {
                    newPasswordCheckMsg.innerText = "새 비밀번호를 입력해주세요.";
                    newPasswordCheckMsg.style.color = "red";
                    return;
                }

                if (newPassword.value !== newPasswordCheck.value) {
                    newPasswordCheckMsg.innerText = "새 비밀번호가 일치하지 않습니다.";
                    newPasswordCheckMsg.style.color = "red";
                    return;
                }

                newPasswordCheckMsg.innerText = "";

                const formData = new FormData();
                formData.append("oldPassword", currentPassword.value);
                formData.append("newPassword", newPassword.value);

                fetch("/mypage/password", {
                    method: "POST",
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error();
                    }

                    alert("비밀번호가 변경되었습니다.");
                    closePasswordModal();
                })
                .catch(() => {
                    alert("비밀번호 변경 중 오류가 발생했습니다.");
                });
            });
        });
    </script>
</th:block>
