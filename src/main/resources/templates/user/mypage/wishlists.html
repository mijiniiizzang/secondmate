<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/user/mypage-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/user/wishlists.css}">
    <th:block th:replace="~{common/head :: commonHead}"></th:block>
    <title>찜한 상품</title>
</head>

<body class="wishlists-page">

    <div th:replace="~{common/header :: header}"></div>

    <main class="wishlists-container">

        <div th:replace="~{user/mypage/mypage-sidebar :: userSidebar}"></div>

        <section class="wishlists-content">

            <div class="wishlists-title">
                <p class="wishlists-label">WISHLIST</p>
                <h1>찜한 상품</h1>
                <p>관심 있는 상품을 확인할 수 있어요.</p>
            </div>

            <form class="wishlist-category-filter" th:action="@{/mypage/wishlists}" method="get">

                <div class="wishlist-category-list">

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="ELECTRONICS"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).ELECTRONICS)}"
                            onchange="this.form.submit()">
                        <span>전자제품</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="FASHION"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).FASHION)}"
                            onchange="this.form.submit()">
                        <span>의류</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="BEAUTY"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).BEAUTY)}"
                            onchange="this.form.submit()">
                        <span>미용/화장품</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="BOOK"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).BOOK)}"
                            onchange="this.form.submit()">
                        <span>도서</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="SPORTS"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).SPORTS)}"
                            onchange="this.form.submit()">
                        <span>스포츠용품</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="FURNITURE"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).FURNITURE)}"
                            onchange="this.form.submit()">
                        <span>가구</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="HOBBY"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).HOBBY)}"
                            onchange="this.form.submit()">
                        <span>취미</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="FOOD"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).FOOD)}"
                            onchange="this.form.submit()">
                        <span>음식</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="TICKET"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).TICKET)}"
                            onchange="this.form.submit()">
                        <span>티켓</span>
                    </label>

                    <label class="wishlist-category-button">
                        <input type="checkbox" name="categories" value="ETC"
                            th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).ETC)}"
                            onchange="this.form.submit()">
                        <span>기타</span>
                    </label>

                </div>
            </form>

            <table class="wishlists-table" th:if="${!wishlists.empty}">
                <thead>
                    <tr>
                        <th>게시글 제목</th>
                        <th>상품명</th>
                        <th>거래 상태</th>
                        <th>찜</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="wishlist : ${wishlists.content}">
                        <td>
                            <a th:href="@{/product/detail(productId=${wishlist.productId})}"
                                th:text="${wishlist.productDTO.title}">
                                게시글 제목
                            </a>
                        </td>

                        <td th:text="${wishlist.productDTO.name}">
                            상품명
                        </td>

                        <td>
                            <span th:if="${wishlist.productDTO.tradeStatus.name() == 'ON_SALE'}">
                                판매중
                            </span>

                            <span th:if="${wishlist.productDTO.tradeStatus.name() == 'RESERVED'}">
                                예약중
                            </span>

                            <span th:if="${wishlist.productDTO.tradeStatus.name() == 'SOLD'}">
                                판매완료
                            </span>
                        </td>

                        <td>
                            <form th:action="@{/wishlist/delete/{productId}(productId=${wishlist.productId})}"
                                method="post">

                                <button type="submit" onclick="return confirm('찜 목록에서 삭제하시겠습니까?')">
                                    찜 해제
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <section class="wishlists-empty" th:if="${wishlists.empty}">
                <p>찜한 상품이 없습니다.</p>

                <a th:href="@{/product/list}">
                    상품 둘러보기
                </a>
            </section>

            <nav class="wishlists-pagination" th:if="${wishlists.totalPages > 1}">

                <a th:if="${!wishlists.first}"
                    th:href="@{/mypage/wishlists(page=${wishlists.number - 1}, categories=${categories})}">
                    이전
                </a>

                <span th:each="page : ${#numbers.sequence(0, wishlists.totalPages - 1)}">

                    <a th:if="${page != wishlists.number}"
                        th:href="@{/mypage/wishlists(page=${page}, categories=${categories})}" th:text="${page + 1}">
                    </a>

                    <strong th:if="${page == wishlists.number}" th:text="${page + 1}">
                    </strong>

                </span>

                <a th:if="${!wishlists.last}"
                    th:href="@{/mypage/wishlists(page=${wishlists.number + 1}, categories=${categories})}">
                    다음
                </a>

            </nav>

        </section>
    </main>

    <div th:replace="~{common/footer :: footer}"></div>

</body>

</html>
