<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/user/mypage-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/user/trades.css}">
    <link rel="stylesheet" th:href="@{/css/user/review-list-modal.css}">
    <link rel="stylesheet" th:href="@{/css/user/review-modal.css}">
    <th:block th:replace="~{common/head :: commonHead}"></th:block>
    <title>내 거래내역</title>
</head>

<body class="trades-page">

    <div th:replace="~{common/header :: header}"></div>

    <main class="trades-container">

        <div th:replace="~{user/mypage/mypage-sidebar :: userSidebar}"></div>

        <section class="trades-content">

            <div class="trades-title">
                <p class="trades-label">MY TRADES</p>
                <h1>내 거래내역</h1>
                <p>구매하거나 판매한 상품과 거래 후기를 확인할 수 있어요.</p>
            </div>

            <div class="trade-review-list-button-row">
                <button type="button" class="trade-review-list-button" onclick="openReviewListModal('received')">
                    받은 후기 보기
                </button>

                <button type="button" class="trade-review-list-button" onclick="openReviewListModal('written')">
                    작성한 후기 보기
                </button>
            </div>

            <section class="trades-section">
                <div class="trades-section-title">
                    <h2>구매내역</h2>
                    <span th:text="${purchaseTrades.size()} + '건'">0건</span>
                </div>

                <table class="trades-table" th:if="${!purchaseTrades.isEmpty()}">
                    <thead>
                        <tr>
                            <th>상품 제목</th>
                            <th>상품명</th>
                            <th>구매날짜</th>
                            <th>후기</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="trade : ${purchaseTrades}">
                            <td>
                                <a th:href="@{/product/detail(productId=${trade.productId})}"
                                    th:text="${trade.productTitle}">
                                    상품 제목
                                </a>
                            </td>

                            <td th:text="${trade.productName}">
                                상품명
                            </td>

                            <td th:text="${trade.completedAt != null
                                ? #temporals.format(trade.completedAt, 'yyyy.MM.dd')
                                : '-'}">
                                2026.07.07
                            </td>

                            <td>
                                <button type="button" class="trade-review-btn" th:if="${trade.canWriteReview}"
                                    th:data-chat-room-id="${trade.chatRoomId}" th:data-reviewee-id="${trade.revieweeId}"
                                    th:data-reviewee-nickname="${trade.revieweeNickname}">
                                    후기 쓰기
                                </button>

                                <span class="trade-review-done"
                                    th:if="${!trade.canWriteReview and trade.reviewWritten}">
                                    작성완료
                                </span>

                                <span class="trade-review-none"
                                    th:if="${!trade.canWriteReview and !trade.reviewWritten}">
                                    -
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="trades-empty" th:if="${purchaseTrades.isEmpty()}">
                    구매한 상품이 없습니다.
                </div>
            </section>

            <section class="trades-section">
                <div class="trades-section-title">
                    <h2>판매내역</h2>
                    <span th:text="${salesTrades.size()} + '건'">0건</span>
                </div>

                <table class="trades-table" th:if="${!salesTrades.isEmpty()}">
                    <thead>
                        <tr>
                            <th>상품 제목</th>
                            <th>상품명</th>
                            <th>거래상태</th>
                            <th>거래날짜</th>
                            <th>후기</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="trade : ${salesTrades}">
                            <td>
                                <a th:href="@{/product/detail(productId=${trade.productId})}"
                                    th:text="${trade.productTitle}">
                                    상품 제목
                                </a>
                            </td>

                            <td th:text="${trade.productName}">
                                상품명
                            </td>

                            <td>
                                <span th:if="${trade.tradeStatus.name() == 'RESERVED'}">
                                    예약중
                                </span>

                                <span th:if="${trade.tradeStatus.name() == 'SOLD'}">
                                    판매완료
                                </span>
                            </td>

                            <td th:text="${trade.tradeStatus.name() == 'SOLD'
                                ? #temporals.format(trade.completedAt, 'yyyy.MM.dd')
                                : #temporals.format(trade.tradeDate, 'yyyy.MM.dd')}">
                                2026.07.07
                            </td>

                            <td>
                                <button type="button" class="trade-review-btn" th:if="${trade.canWriteReview}"
                                    th:data-chat-room-id="${trade.chatRoomId}" th:data-reviewee-id="${trade.revieweeId}"
                                    th:data-reviewee-nickname="${trade.revieweeNickname}">
                                    후기 쓰기
                                </button>

                                <span class="trade-review-done"
                                    th:if="${!trade.canWriteReview and trade.reviewWritten}">
                                    작성완료
                                </span>

                                <span class="trade-review-none"
                                    th:if="${!trade.canWriteReview and !trade.reviewWritten}">
                                    -
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="trades-empty" th:if="${salesTrades.isEmpty()}">
                    판매한 상품이 없습니다.
                </div>
            </section>

        </section>
    </main>

    <div th:replace="~{common/footer :: footer}"></div>

    <div th:replace="~{user/mypage/review-list-modal :: reviewListModal}"></div>

    <script>
        document.querySelectorAll(".trade-review-btn").forEach(button => {
            button.addEventListener("click", function () {
                const chatRoomId = this.dataset.chatRoomId;
                const revieweeId = this.dataset.revieweeId;
                const revieweeNickname = this.dataset.revieweeNickname;

                document.getElementById("reviewChatRoomId").value = chatRoomId;
                document.getElementById("reviewRevieweeId").value = revieweeId;
                document.getElementById("reviewTargetNickname").textContent = revieweeNickname;

                const checkedInput = document.querySelector("#reviewForm input[name='reviewType'][value='GOOD']");
                if (checkedInput) {
                    checkedInput.checked = true;
                }

                const content = document.querySelector("#reviewForm textarea[name='content']");
                if (content) {
                    content.value = "";
                }

                document.getElementById("reviewModal").hidden = false;
            });
        });
    </script>

</body>

</html>
