<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link rel="stylesheet" href="/css/userRegister.css" th:href="@{/css/userRegister.css}">
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8d0f47ae6501392120a8bdcab71e77e4"></script>
</head>

<body class="register-page">
    <main class="register-wrap">
        <section class="register-card">
            <div class="register-title-area">
                <h1>회원가입</h1>
                <p>기본 정보를 입력해주세요.</p>
            </div>

            <form th:action="@{/user/register}" method="POST" id="getPhone">

                <div class="form-group">
                    <label for="username">아이디</label>

                    <div class="input-button-row">
                        <input type="text" id="username" name="username" required>

                        <button type="button" class="check-btn" onclick="checkUsername()">
                            중복확인
                        </button>
                    </div>

                    <span id="usernameMsg" class="form-msg"></span>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="nickname">닉네임</label>
                    <input type="text" id="nickname" name="nickname" required>

                    <span id="nicknameMsg" class="form-msg"></span>
                </div>

                <div class="form-group">
                    <label>전화번호</label>

                    <div class="phone-row">
                        <input type="text" id="phone1" name="phone1" maxlength="3" required>
                        <span>-</span>
                        <input type="text" id="phone2" name="phone2" maxlength="4" required>
                        <span>-</span>
                        <input type="text" id="phone3" name="phone3" maxlength="4" required>
                    </div>

                    <input type="hidden" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label>거래 희망 지역</label>
                    <div class="region-row">
                        <select id="city" name="city" required onchange="changeGu()">
                            <option value="">시/도 선택</option>
                            <option value="서울특별시">서울특별시</option>
                            <option value="부산광역시">부산광역시</option>
                            <option value="대구광역시">대구광역시</option>
                            <option value="인천광역시">인천광역시</option>
                            <option value="광주광역시">광주광역시</option>
                            <option value="대전광역시">대전광역시</option>
                            <option value="울산광역시">울산광역시</option>
                            <option value="세종특별자치시">세종특별자치시</option>
                            <option value="경기도">경기도</option>
                            <option value="강원도">강원도</option>
                            <option value="충청북도">충청북도</option>
                            <option value="충청남도">충청남도</option>
                            <option value="전라북도">전라북도</option>
                            <option value="전라남도">전라남도</option>
                            <option value="경상북도">경상북도</option>
                            <option value="경상남도">경상남도</option>
                            <option value="제주도">제주도</option>
                        </select>

                        <select id="gu" name="gu" required onchange="setAddress()">
                            <option value="">구/군 선택</option>
                        </select>
                    </div>
                    <label>거래 위치</label>
                    <div id="map"></div>
                    <input type="hidden" id="latitude" name="latitude">
                    <input type="hidden" id="longitude" name="longitude">

                    <input type="hidden" id="address" name="address">
                </div>

                <button type="submit" class="register-btn">가입하기</button>
            </form>
        </section>
    </main>

    <script>
        function checkUsername() {
            const username = document.getElementById("username").value;
            const msg = document.getElementById("usernameMsg");

            if (!username) {
                msg.innerText = "아이디를 입력하세요";
                msg.style.color = "red";
                return;
            }

            fetch("/user/register/check-username?username=" + username)
                .then(res => res.text())
                .then(result => {
                    if (result == "true") {
                        msg.innerText = "이미 사용 중인 아이디입니다.";
                        msg.style.color = "red";
                    } else {
                        msg.innerText = "사용 가능한 아이디입니다.";
                        msg.style.color = "green";
                    }
                });
        }

        document.getElementById("nickname").addEventListener("keyup", function () {
            const nickname = this.value;
            const msg = document.getElementById("nicknameMsg");

            if (nickname.length < 1) {
                msg.innerText = "";
                return;
            }

            fetch("/user/register/check-nickname?nickname=" + encodeURIComponent(nickname))
                .then(res => res.text())
                .then(result => {
                    if (result === "true") {
                        msg.innerText = "이미 사용 중인 닉네임입니다.";
                        msg.style.color = "red";
                    } else {
                        msg.innerText = "사용 가능한 닉네임입니다.";
                        msg.style.color = "green";
                    }
                });
        });

        document.getElementById("getPhone").addEventListener("submit", function (event) {
            event.preventDefault();

            const phone1 = document.getElementById("phone1").value;
            const phone2 = document.getElementById("phone2").value;
            const phone3 = document.getElementById("phone3").value;

            document.getElementById("phone").value =
                phone1 + "-" + phone2 + "-" + phone3;

            const latitude = document.getElementById("latitude").value;
            const longitude = document.getElementById("longitude").value;
            if(!latitude || !longitude) {
                alert("거래 위치를 선택해주세요.");
                return;
            }

            const formData = new FormData(this);

            fetch("/user/register", {
                method: "POST",
                body: formData
            })
            .then(response => {
                if(!response.ok) {
                    throw new Error();
                }

                alert("회원가입이 완료되었습니다.");
                location.href = "/";
            })
            .catch(() => {
                alert("회원가입에 실패했습니다.");
            });
        });

        function changeGu() {
            const city = document.getElementById("city").value;
            const gu = document.getElementById("gu");

            gu.innerHTML = '<option value="">구/군 선택</option>';

            if (areaData[city]) {
                areaData[city].forEach(item => {
                    const option = document.createElement("option");
                    option.value = item;
                    option.textContent = item;
                    gu.appendChild(option);
                });
            }
        }

        function setAddress() {
            const city = document.getElementById("city").value;
            const gu = document.getElementById("gu").value;

            let address = "";

            if (city === "세종특별자치시") {
                address = city;
            } else {
                address = city + " " + gu;
            }

            document.getElementById("address").value = address;
        }

        // 지도에서 선택한 좌표 저장
        const mapContainer = document.getElementById("map");

        const mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 5
        };

        const map = new kakao.maps.Map(mapContainer, mapOption);

        let marker;

        kakao.maps.event.addListener(map, "click", function(mouseEvent) {
            const latlng = mouseEvent.latLng;

            document.getElementById("latitude").value = latlng.getLat();
            document.getElementById("longitude").value = latlng.getLng();

            if(marker) {
                marker.setMap(null);
            }

            marker = new kakao.maps.Marker({
                position: latlng
            });

            marker.setMap(map);
        });

    </script>
</body>

</html>
