<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="header">

    <header class="site-header">
        <div class="header-container">

            <div class="header-left">
                <nav class="main-nav">
                    <a th:href="@{/home}">메인</a>
                    <a th:href="@{/product/list}">상품 둘러보기</a>
                </nav>
            </div>

            <div class="header-right">

                <!-- 비로그인 -->
                <div class="guest-menu" sec:authorize="isAnonymous()">
                    <a class="header-text-link" th:href="@{/user/register}">회원가입</a>

                    <button type="button"
                            class="header-login-btn"
                            onclick="openLoginModal()">
                        로그인
                    </button>
                </div>

                <!-- 일반 사용자 로그인 -->
                <div class="user-menu" sec:authorize="hasRole('USER')">
                    <a class="header-write-btn" th:href="@{/product/register}">
                        글쓰기
                    </a>

                    <button type="button" class="header-chat-btn" onclick="openChatPanel()">
                        채팅
                        <span id="chatUnreadBadge" style="display: none;"></span>
                    </button>

                    <a class="header-icon-link" th:href="@{/user/messages}">
                        쪽지함
                        <span id="notificationBadge" style="display: none;">N</span>
                    </a>

                    <a class="header-user-link" th:href="@{/mypage}">
                        <span class="header-user-name"
                              th:text="${#authentication.principal.nickname} + '님'">
                        </span>
                        <span>마이페이지</span>
                    </a>

                    <form th:action="@{/auth/logout}" method="POST">
                        <button type="submit" class="header-logout-btn">
                            로그아웃
                        </button>
                    </form>
                </div>

                <!-- 관리자 로그인 -->
                <div class="user-menu" sec:authorize="hasRole('ADMIN')">
                    <a class="header-admin-link" th:href="@{/admin/home}">
                        관리자 페이지
                    </a>

                    <span class="header-user-name"
                          th:text="${#authentication.principal.nickname} + '님'">
                    </span>

                    <form th:action="@{/auth/logout}" method="POST">
                        <button type="submit" class="header-logout-btn">
                            로그아웃
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </header>

    <!-- 로그인 / 아이디 찾기 / 비밀번호 찾기 모달 -->
    <div id="loginModal" class="login-modal">
        <div class="login-modal-box">

            <button type="button"
                    class="modal-close-btn"
                    onclick="closeLoginModal()">
                ×
            </button>

            <div id="loginView" class="auth-view active">
                <div th:replace="~{auth/login :: loginForm}"></div>
            </div>

            <div id="findUsernameView" class="auth-view">
                <div th:replace="~{auth/find-username :: findUsernameForm}"></div>
            </div>

            <div id="findPasswordView" class="auth-view">
                <div th:replace="~{auth/find-password :: findPasswordForm}"></div>
            </div>

        </div>
    </div>

    <div th:replace="~{chat/chat-panel :: chatPanel}"></div>

    <script>
        function openLoginModal() {
            document.getElementById("redirectUrl").value =
                window.location.pathname + window.location.search;

            document.getElementById("loginModal").classList.add("show");
            document.body.style.overflow = "hidden";

            showLoginForm();
        }

        function closeLoginModal() {
            document.getElementById("loginModal").classList.remove("show");
            document.body.style.overflow = "";
        }

        function showLoginForm() {
            document.getElementById("loginView").classList.add("active");
            document.getElementById("findUsernameView").classList.remove("active");
            document.getElementById("findPasswordView").classList.remove("active");
        }

        function showFindUsernameForm() {
            document.getElementById("loginView").classList.remove("active");
            document.getElementById("findUsernameView").classList.add("active");
            document.getElementById("findPasswordView").classList.remove("active");
        }

        function showFindPasswordForm() {
            document.getElementById("loginView").classList.remove("active");
            document.getElementById("findUsernameView").classList.remove("active");
            document.getElementById("findPasswordView").classList.add("active");
        }

        document.getElementById("loginModal").addEventListener("click", function(event) {
            if (event.target === this) {
                closeLoginModal();
            }
        });


    </script>

    <script sec:authorize="isAuthenticated()">
        fetch("/user/messages/unread")
            .then(response => response.json())
            .then(hasUnreadNotification => {
                if (hasUnreadNotification) {
                    document.getElementById("notificationBadge").style.display = "inline";
                }
            })
    </script>

</th:block>

</html>
