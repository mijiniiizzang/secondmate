<th:block th:fragment="userReport">

    <link rel="stylesheet" th:href="@{/css/report-form.css}">

    <div id="userReportModal" class="report-modal-wrapper">
        <form class="report-form"
              id="userReportForm"
              method="POST">

            <button type="button"
                    class="report-modal-close"
                    onclick="closeUserReportModal()">
                x
            </button>

            <h2>사용자 신고</h2>

            <p>
                신고자 :
                <span th:text="${#authorization.expression('isAuthenticated()') ? #authentication.principal.nickname : ''}">
                </span>
            </p>

            <p>
                신고 대상 :
                <span id="reportedUserNickname"></span>
            </p>

            <p>신고 유형 : </p>

            <select name="reportType" required>
                <option value="">신고 유형을 선택해주세요</option>
                <option value="USER_FRAUD">사기 의심</option>
                <option value="USER_HARASSMENT">괴롭힘 / 비방</option>
                <option value="USER_IMPERSONATION">사칭</option>
                <option value="OTHER">기타</option>
            </select>

            <p>신고 내용 : </p>

            <textarea name="reason"
                      rows="5"
                      cols="30"
                      placeholder="신고 사유를 입력해주세요"
                      required></textarea>

            <button type="submit">신고접수</button>

        </form>
    </div>

    <script>
        function openUserReportModal(reportedUserId, reportedUserNickname) {
            if (!reportedUserId) {
                alert("신고 대상을 불러오지 못했습니다.");
                return;
            }

            document.getElementById("userReportForm").action =
                "/report/api/user/" + reportedUserId;

            document.getElementById("reportedUserNickname").textContent =
                reportedUserNickname;

            document.getElementById("userReportModal").style.display = "flex";
        }

        function closeUserReportModal() {
            document.getElementById("userReportModal").style.display = "none";
        }

        document.getElementById("userReportForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const form = event.currentTarget;
            const formData = new FormData(form);
            const params = new URLSearchParams(formData);

            fetch(form.action, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: params
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("사용자 신고 실패");
                    }

                    alert("신고가 접수되었습니다.");
                    closeUserReportModal();
                    form.reset();
                })
                .catch(() => {
                    alert("이미 신고된 사용자입니다.");
                });
        });
    </script>

</th:block>
