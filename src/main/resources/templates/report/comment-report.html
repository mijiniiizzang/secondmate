<th:block th:fragment="commentReport">
    <link rel="stylesheet" th:href="@{/css/report-form.css}">
    <button type="button" class="report-modal-close" onclick="closeCommentReport()">x</button>
    <!-- 댓글 신고 -->
    <form class="report-form" id="commentReportForm" method="POST">
        <h2>댓글 신고</h2>
        <p>댓글 작성자 : <span id="reportCommentWriter"></span></p>
        <p>댓글 내용 : <span id="reportCommentContent"></span></p>
        <input type="hidden" name="productId" id="reportProductId">
        <p>신고 유형 : </p>
        <select name="reportType" required>
            <option value="">신고 유형을 선택해주세요</option>
            <option value="COMMENT_ABUSE">욕설 / 비방</option>
            <option value="COMMENT_SPAM">도배 / 광고</option>
            <option value="COMMENT_FALSE_INFORMATION">허위 정보</option>
            <option value="OTHER">기타</option>
        </select>
        <p>신고 내용 : </p>
        <textarea name="reason" rows="5" cols="30" placeholder="신고 사유를 입력해주세요" required></textarea>
        <button type="submit">신고접수</button>
    </form>
</th:block>
