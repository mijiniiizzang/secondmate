<th:block th:fragment="findPasswordForm">

    <div class="auth-modal-title-area">
        <h2>비밀번호 찾기</h2>
    </div>

    <form th:if="${verified == null}" th:action="@{/auth/find-password/check}" method="POST" id="findPasswordForm">

        <div class="login-input-group">
            <label for="findPasswordUsername">아이디</label>
            <input type="text" id="findPasswordUsername" name="username" required>
        </div>

        <div class="login-input-group">
            <label for="findPasswordName">이름</label>
            <input type="text" id="findPasswordName" name="name" required>
        </div>

        <div class="login-input-group">
            <label>전화번호</label>

            <div class="find-phone-row">
                <input type="text" id="findPasswordPhone1" maxlength="3" required>
                <span>-</span>
                <input type="text" id="findPasswordPhone2" maxlength="4" required>
                <span>-</span>
                <input type="text" id="findPasswordPhone3" maxlength="4" required>
            </div>

            <input type="hidden" id="findPasswordPhone" name="phone">
        </div>

        <div class="login-input-group">
            <label for="findPasswordEmail">이메일</label>
            <input type="email" id="findPasswordEmail" name="email" required>
        </div>

        <button type="submit" class="modal-login-btn">본인 확인</button>
    </form>

    <form th:if="${verified}" th:action="@{/auth/find-password/reset}" method="POST">

        <input type="hidden" name="username" th:value="${username}">
        <input type="hidden" name="name" th:value="${name}">
        <input type="hidden" name="phone" th:value="${phone}">
        <input type="hidden" name="email" th:value="${email}">

        <div class="login-input-group">
            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" name="newPassword" required>
        </div>

        <div class="login-input-group">
            <label for="confirmPassword">새 비밀번호 확인</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>

        <span id="errorMsg" class="auth-result-msg"></span>

        <button type="submit" class="modal-login-btn">비밀번호 변경</button>
    </form>

    <p class="auth-bottom-link">
        <button type="button" onclick="showLoginForm()">로그인으로 돌아가기</button>
    </p>

    <script>
        const findPasswordForm = document.getElementById("findPasswordForm");

        if (findPasswordForm) {
            findPasswordForm.addEventListener("submit", function () {
                const phone1 = document.getElementById("findPasswordPhone1").value;
                const phone2 = document.getElementById("findPasswordPhone2").value;
                const phone3 = document.getElementById("findPasswordPhone3").value;

                document.getElementById("findPasswordPhone").value = phone1 + "-" + phone2 + "-" + phone3;
            });
        }

        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const msg = document.getElementById("errorMsg");

        if (newPassword && confirmPassword) {
            function checkPassword() {
                if (newPassword.value === "" || confirmPassword.value === "") {
                    msg.innerText = "";
                } else if (newPassword.value !== confirmPassword.value) {
                    msg.innerText = "비밀번호가 일치하지 않습니다.";
                    msg.style.color = "red";
                } else {
                    msg.innerText = "비밀번호가 일치합니다.";
                    msg.style.color = "green";
                }
            }

            newPassword.addEventListener("keyup", checkPassword);
            confirmPassword.addEventListener("keyup", checkPassword);
        }
    </script>

</th:block>
