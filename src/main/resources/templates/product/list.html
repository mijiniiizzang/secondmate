<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{common/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/productList.css}">
    <title>상품 리스트</title>
</head>

<body>
    <div th:replace="~{common/header :: header}"></div>

    <h1 th:text="${sort == 'likes'} ? '인기상품' : '상품 리스트'">상품 리스트</h1>

    <!-- 검색 -->
    <form th:action="@{/product/list}" method="GET">
        <input type="hidden" name="sort" th:value="${sort}">

        <div id="searchProduct">
            <select id="category" name="category">
                <option value="">전체 카테고리</option>
                <option value="ELECTRONICS" th:selected="${category == 'ELECTRONICS'}">전자제품</option>
                <option value="FASHION" th:selected="${category == 'FASHION'}">의류</option>
                <option value="BEAUTY" th:selected="${category == 'BEAUTY'}">미용/화장품</option>
                <option value="BOOK" th:selected="${category == 'BOOK'}">도서</option>
                <option value="SPORTS" th:selected="${category == 'SPORTS'}">스포츠용품</option>
                <option value="FURNITURE" th:selected="${category == 'FURNITURE'}">가구</option>
                <option value="HOBBY" th:selected="${category == 'HOBBY'}">취미</option>
                <option value="FOOD" th:selected="${category == 'FOOD'}">음식</option>
                <option value="TICKET" th:selected="${category == 'TICKET'}">티켓</option>
                <option value="ETC" th:selected="${category == 'ETC'}">기타</option>
            </select>
            <input type="text" name="keyword" placeholder="찾고 싶은 상품을 검색하세요" th:value="${keyword}">
            <button type="submit">검색</button>
        </div>
    </form>

    <div class="product-content-wrap">
        <aside class="filter-sidebar">
            <h3>필터</h3>

            <form th:action="@{/product/list}" method="GET">
                <input type="hidden" name="keyword" th:value="${keyword}">
                <input type="hidden" name="category" th:value="${category}">
                <input type="hidden" name="sort" th:value="${sort}">

                <!-- 거래 가능 여부 -->
                <label>
                    <input type="checkbox"
                           name="availableOnly"
                           value="true"
                           th:checked="${availableOnly}">
                    거래 가능한 상품만 보기
                </label>

                <!-- 위치 -->
                <label>
                    <input type="checkbox"
                           id="nearbyOnly"
                           name="nearbyOnly"
                           value="true"
                           th:checked="${nearbyOnly}">
                    내 위치 반경 3km 이내
                </label>

                <!-- 시/도, 구/군으로 검색-->
                <p>거래 희망 지역</p>
                <select id="city" name="city" onchange="changeGu()">
                    <option value="">시/도 선택</option>
                    <option value="서울특별시" th:selected="${city == '서울특별시'}">서울특별시</option>
                    <option value="부산광역시" th:selected="${city == '부산광역시'}">부산광역시</option>
                    <option value="대구광역시" th:selected="${city == '대구광역시'}">대구광역시</option>
                    <option value="인천광역시" th:selected="${city == '인천광역시'}">인천광역시</option>
                    <option value="광주광역시" th:selected="${city == '광주광역시'}">광주광역시</option>
                    <option value="대전광역시" th:selected="${city == '대전광역시'}">대전광역시</option>
                    <option value="울산광역시" th:selected="${city == '울산광역시'}">울산광역시</option>
                    <option value="세종특별자치시" th:selected="${city == '세종특별자치시'}">세종특별자치시</option>
                    <option value="경기도" th:selected="${city == '경기도'}">경기도</option>
                    <option value="강원도" th:selected="${city == '강원도'}">강원도</option>
                    <option value="충청북도" th:selected="${city == '충청북도'}">충청북도</option>
                    <option value="충청남도" th:selected="${city == '충청남도'}">충청남도</option>
                    <option value="전라북도" th:selected="${city == '전라북도'}">전라북도</option>
                    <option value="전라남도" th:selected="${city == '전라남도'}">전라남도</option>
                    <option value="경상북도" th:selected="${city == '경상북도'}">경상북도</option>
                    <option value="경상남도" th:selected="${city == '경상남도'}">경상남도</option>
                    <option value="제주도" th:selected="${city == '제주도'}">제주도</option>
                </select>

                <select id="gu" name="gu" th:attr="data-selected-gu=${gu}">
                    <option value="">구/군 선택</option>
                </select>

                <!-- 카테고리 -->
                <p>카테고리</p>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="ELECTRONICS"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).ELECTRONICS)}">
                    전자제품
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="FASHION"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).FASHION)}">
                    의류
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="BEAUTY"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).BEAUTY)}">
                    미용/화장품
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="BOOK"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).BOOK)}">
                    도서
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="SPORTS"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).SPORTS)}">
                    스포츠용품
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="FURNITURE"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).FURNITURE)}">
                    가구
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="HOBBY"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).HOBBY)}">
                    취미
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="FOOD"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).FOOD)}">
                    음식
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="TICKET"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).TICKET)}">
                    티켓
                </label>
                <label>
                    <input type="checkbox"
                           name="categories"
                           value="ETC"
                           th:checked="${categories != null and categories.contains(T(com.example.secondmate.common.ProductCategory).ETC)}">
                    기타
                </label>

                <!-- 가격 -->
                <p>가격</p>
                <button type="button" onclick="setMaxPrice(0)">나눔</button>
                <button type="button" onclick="setMaxPrice(5000)">5,000원 이하</button>
                <button type="button" onclick="setMaxPrice(10000)">10,000원 이하</button>
                <button type="button" onclick="setMaxPrice(20000)">20,000원 이하</button>

                <input type="number"
                       id="minPrice"
                       name="minPrice"
                       th:value="${minPrice != null ? minPrice : 0}"
                       placeholder="0">

                <input type="number"
                       id="maxPrice"
                       name="maxPrice"
                       th:value="${maxPrice}"
                       placeholder="최대 가격">

                <button type="submit">필터 적용</button>
            </form>
        </aside>

        <!-- 상품 리스트 -->
        <div class="product-list">
            <div class="product-card" th:each="product : ${products.content}">
                <div class="product-image-area">
                    <a th:href="@{/product/detail(productId=${product.productId})}">
                        <img th:if="${!#lists.isEmpty(product.imageList)}"
                             th:src="@{'/upload/' + ${product.imageList.?[mainImage][0].imageChgName}}"
                             th:alt="${product.title}"
                             class="product-image">

                        <div th:if="${#lists.isEmpty(product.imageList)}" class="product-image-placeholder">
                            상품 이미지 없음
                        </div>
                    </a>

                    <button type="button"
                            class="wish-btn"
                            th:data-product-id="${product.productId}"
                            th:data-logged-in="${#authorization.expression('isAuthenticated()')}"
                            th:text="${product.isWished} ? '♥' : '♡'"
                            onclick="toggleWishlist(this)">
                        ♡
                    </button>
                </div>

                <div class="product-info">
                    <a th:href="@{/product/detail(productId=${product.productId})}" class="product-title-link">
                        <p class="product-title" th:text="${product.title}">상품 제목</p>
                    </a>

                    <p class="product-price" th:text="${#numbers.formatInteger(product.price, 3, 'COMMA') + '원'}">
                    </p>

                    <div class="product-meta">
                        <span th:text="${product.city + ' ' + product.gu}"></span>
                        <span class="reg-time" th:attr="data-reg-date=${product.regDate}"></span>
                    </div>
                </div>
            </div>

            <p class="empty-product" th:if="${products.empty}">
                조건에 맞는 상품이 없습니다.
            </p>
        </div>
    </div>

    <script>
        function setMaxPrice(price) {
            document.getElementById("minPrice").value = 0;
            document.getElementById("maxPrice").value = price;
        }

        const areaData = {
            "서울특별시": [
                "강남구", "강동구", "강북구", "강서구", "관악구",
                "광진구", "구로구", "금천구", "노원구", "도봉구",
                "동대문구", "동작구", "마포구", "서대문구", "서초구",
                "성동구", "성북구", "송파구", "양천구", "영등포구",
                "용산구", "은평구", "종로구", "중구", "중랑구"
            ],

            "부산광역시": [
                "강서구", "금정구", "기장군", "남구", "동구",
                "동래구", "부산진구", "북구", "사상구", "사하구",
                "서구", "수영구", "연제구", "영도구", "중구", "해운대구"
            ],

            "대구광역시": [
                "군위군", "남구", "달서구", "달성군", "동구",
                "북구", "서구", "수성구", "중구"
            ],

            "인천광역시": [
                "강화군", "계양구", "남동구", "동구", "미추홀구",
                "부평구", "서구", "연수구", "옹진군", "중구"
            ],

            "광주광역시": [
                "광산구", "남구", "동구", "북구", "서구"
            ],

            "대전광역시": [
                "대덕구", "동구", "서구", "유성구", "중구"
            ],

            "울산광역시": [
                "남구", "동구", "북구", "울주군", "중구"
            ],

            "세종특별자치시": [
                "세종특별자치시"
            ],

            "경기도": [
                "가평군", "고양시", "과천시", "광명시", "광주시",
                "구리시", "군포시", "김포시", "남양주시", "동두천시",
                "부천시", "성남시", "수원시", "시흥시", "안산시",
                "안성시", "안양시", "양주시", "양평군", "여주시",
                "연천군", "오산시", "용인시", "의왕시", "의정부시",
                "이천시", "파주시", "평택시", "포천시", "하남시", "화성시"
            ],

            "강원도": [
                "강릉시", "고성군", "동해시", "삼척시", "속초시",
                "양구군", "양양군", "영월군", "원주시", "인제군",
                "정선군", "철원군", "춘천시", "태백시", "평창군",
                "홍천군", "화천군", "횡성군"
            ],

            "충청북도": [
                "괴산군", "단양군", "보은군", "영동군", "옥천군",
                "음성군", "제천시", "증평군", "진천군", "청주시", "충주시"
            ],

            "충청남도": [
                "계룡시", "공주시", "금산군", "논산시", "당진시",
                "보령시", "부여군", "서산시", "서천군", "아산시",
                "예산군", "천안시", "청양군", "태안군", "홍성군"
            ],

            "전라북도": [
                "고창군", "군산시", "김제시", "남원시", "무주군",
                "부안군", "순창군", "완주군", "익산시", "임실군",
                "장수군", "전주시", "정읍시", "진안군"
            ],

            "전라남도": [
                "강진군", "고흥군", "곡성군", "광양시", "구례군",
                "나주시", "담양군", "목포시", "무안군", "보성군",
                "순천시", "신안군", "여수시", "영광군", "영암군",
                "완도군", "장성군", "장흥군", "진도군", "함평군",
                "해남군", "화순군"
            ],

            "경상북도": [
                "경산시", "경주시", "고령군", "구미시", "김천시",
                "문경시", "봉화군", "상주시", "성주군", "안동시",
                "영덕군", "영양군", "영주시", "영천시", "예천군",
                "울릉군", "울진군", "의성군", "청도군", "청송군",
                "칠곡군", "포항시"
            ],

            "경상남도": [
                "거제시", "거창군", "고성군", "김해시", "남해군",
                "밀양시", "사천시", "산청군", "양산시", "의령군",
                "진주시", "창녕군", "창원시", "통영시", "하동군",
                "함안군", "함양군", "합천군"
            ],

            "제주도": [
                "서귀포시", "제주시"
            ]
        };

        function changeGu() {
            const city = document.getElementById("city").value;
            const gu = document.getElementById("gu");
            const selectedGu = gu.dataset.selectedGu;

            gu.innerHTML = '<option value="">구/군 선택</option>';

            if (areaData[city]) {
                areaData[city].forEach(item => {
                    const option = document.createElement("option");
                    option.value = item;
                    option.textContent = item;

                    if (selectedGu === item) {
                        option.selected = true;
                    }

                    gu.appendChild(option);
                });
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            changeGu();
        });

        document.querySelectorAll(".reg-time").forEach(function (element) {
            const regDate = new Date(element.dataset.regDate);
            const now = new Date();

            const diffSeconds = Math.floor((now - regDate) / 1000);

            if (diffSeconds < 60) {
                element.textContent = "방금 전";
                return;
            }

            const diffMinutes = Math.floor(diffSeconds / 60);
            if (diffMinutes < 60) {
                element.textContent = diffMinutes + "분 전";
                return;
            }

            const diffHours = Math.floor(diffMinutes / 60);
            if (diffHours < 24) {
                element.textContent = diffHours + "시간 전";
                return;
            }

            const diffDays = Math.floor(diffHours / 24);
            element.textContent = diffDays + "일 전";
        });

        function toggleWishlist(button) {
            const loggedIn = button.dataset.loggedIn === "true";

            if (!loggedIn) {
                alert("로그인 후 이용할 수 있습니다.");
                openLoginModal();
                return;
            }

            const productId = button.dataset.productId;

            fetch("/wishlist/toggle/" + productId, {
                method: "POST"
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error();
                    }

                    return response.json();
                })
                .then(result => {
                    button.textContent = result.wished ? "♥" : "♡";
                })
                .catch(() => {
                    alert("찜 처리에 실패했습니다.");
                });
        }
    </script>
</body>

</html>
