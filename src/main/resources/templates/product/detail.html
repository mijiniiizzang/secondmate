<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block th:replace="~{common/head :: commonHead}"></th:block>
    <title>상품 상세</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="product-detail-page">

    <div th:replace="~{common/header :: header}"></div>

    <main class="product-detail-wrap">

        <section class="product-detail-card">

            <div class="product-top">

                <!-- 상품 이미지 -->
                <div th:if="${product.imageList != null and !#lists.isEmpty(product.imageList)}"
                    class="product-image-slider-wrap">

                    <button type="button" class="image-slide-button image-prev" onclick="moveProductImages(-1)">
                        ‹
                    </button>

                    <div class="product-image-area" id="productImageArea">
                        <div class="product-image-box" th:each="image : ${product.imageList}">

                            <img th:src="@{'/upload/' + ${image.imageChgName}}" th:alt="${product.name}">
                        </div>
                    </div>

                    <button type="button" class="image-slide-button image-next" onclick="moveProductImages(1)">
                        ›
                    </button>
                </div>

                <div th:if="${product.imageList == null or #lists.isEmpty(product.imageList)}"
                    class="product-empty-image">
                    등록된 사진이 없습니다.
                </div>

                <!-- 상품 정보 -->
                <div class="product-info-area">

                    <span class="product-category" th:text="${product.category}">
                    </span>

                    <h1 class="product-title" th:text="${product.title}">
                    </h1>

                    <p class="product-price">
                        <span th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')}"></span>원
                    </p>

                    <dl class="product-info-list">

                        <div class="product-info-row">
                            <dt>상품명</dt>
                            <dd th:text="${product.name}"></dd>
                        </div>

                        <div class="product-info-row">
                            <dt>작성자</dt>
                            <dd th:text="${product.writer}"></dd>
                        </div>

                        <div class="product-info-row">
                            <dt>거래 상태</dt>
                            <dd>
                                <span class="product-status" th:text="${product.tradeStatus}">
                                </span>
                            </dd>
                        </div>

                        <div class="product-info-row">
                            <dt>거래 희망 지역</dt>
                            <dd th:text="${product.city + ' ' + product.gu}"></dd>
                        </div>

                        <div class="product-info-row">
                            <dt>등록일</dt>
                            <dd th:text="${#temporals.format(product.regDate, 'yyyy.MM.dd')}"></dd>
                        </div>

                    </dl>

                    <div class="product-action-row">

                        <div class="wishlist-area">
                            <button type="button" id="wishlist-btn" class="wishlist-button"
                                th:data-logged-in="${#authorization.expression('isAuthenticated()')}">

                                <span id="heart-icon" th:text="${isWished} ? '♥' : '♡'">
                                    ♡
                                </span>
                            </button>

                            <span class="wishlist-count-text">
                                찜 <span id="wishlist-count" th:text="${wishlistCount}">0</span>
                            </span>
                        </div>

                        <button type="button" class="product-report-button" sec:authorize="isAuthenticated()"
                            th:if="${!isOwner}" onclick="openProductReport()">
                            신고
                        </button>

                        <form th:action="@{/chat/room}" method="POST" sec:authorize="isAuthenticated()"
                            th:if="${!isOwner}">
                            <input type="hidden" name="productId" th:value="${product.productId}">
                            <button type="submit" class="product-chat-button">채팅하기</button>
                        </form>
                        <a class="product-list-button" th:href="@{/product/list}">
                            목록
                        </a>

                    </div>

                </div>
            </div>

            <!-- 상품 설명 -->
            <section class="product-content-area">
                <h2 class="section-title">상품 설명</h2>

                <p class="product-content" th:text="${product.content}">
                </p>
            </section>

            <!-- 작성자 수정 / 삭제 -->
            <div class="owner-action-row" th:if="${isOwner}">

                <form th:action="@{/product/edit}" method="get">
                    <input type="hidden" name="productId" th:value="${product.productId}">
                    <button type="submit">수정</button>
                </form>

                <form th:action="@{/product/delete(productId=${product.productId})}" method="POST">
                    <button type="submit">삭제</button>
                </form>

            </div>

            <!-- 댓글 -->
            <section id="comment-section" class="comment-section">

                <h2 class="section-title">댓글</h2>

                <div sec:authorize="isAuthenticated()" class="comment-write-box">
                    <p>
                        작성자 :
                        <span th:text="${#authentication.principal.nickname}"></span>
                    </p>

                    <textarea id="comment-content" placeholder="댓글을 입력해주세요."></textarea>

                    <button id="comment-submit">등록</button>

                    <div style="clear: both;"></div>
                </div>

                <div sec:authorize="isAnonymous()" class="comment-write-box">
                    <p>댓글은 로그인 후 작성할 수 있습니다.</p>
                </div>

                <p style="margin-top: 24px;">
                    댓글 <span id="comment-count" th:text="${product.commentCount}">0</span>
                </p>

                <ul id="comment-list"></ul>

            </section>

        </section>
    </main>

    <div th:replace="~{common/footer :: footer}"></div>

    <script th:inline="javascript">
        const currentUser =
            /*[[${#authorization.expression('isAuthenticated()') ? #authentication.principal.nickname : ''}]]*/'';

        const productId = /*[[${product.productId}]]*/0;

        $('#comment-submit').click(function () {
            const content = $('#comment-content').val().trim();

            if (!content) {
                alert('내용을 입력해주세요');
                return;
            }

            $.ajax({
                type: 'POST',
                url: '/api/comments',
                contentType: 'application/json',
                data: JSON.stringify({
                    content: content,
                    productId: productId
                }),
                success: function () {
                    alert('댓글 등록 완료');
                    $('#comment-content').val('');
                    loadComments();
                },
                error: function () {
                    alert('댓글 등록 실패');
                }
            });
        });

        function loadComments() {
            $.get(`/api/comments/product/${productId}`, function (comments) {
                $('#comment-list').empty();
                $('#comment-count').text(comments.length);

                if (comments.length === 0) {
                    $('#comment-list').append('<li>등록된 댓글이 없습니다.</li>');
                    return;
                }

                comments.forEach(comment => {
                    let buttons = '';

                    if (currentUser && currentUser === comment.writer) {
                        buttons += `
                            <button onclick="editComment(${comment.commentId})">수정</button>
                            <button onclick="deleteComment(${comment.commentId})">삭제</button>
                            <button id="save-${comment.commentId}"
                                    onclick="saveEdit(${comment.commentId})"
                                    style="display:none">
                                저장
                            </button>
                        `;
                    }

                    if (currentUser && currentUser !== comment.writer) {
                        buttons += `
                            <button onclick='openCommentReport(
                                ${comment.commentId},
                                ${JSON.stringify(comment.writer)},
                                ${JSON.stringify(comment.content)}
                            )'>
                                신고
                            </button>
                        `;
                    }

                    $('#comment-list').append(`
                        <li>
                            <strong>${comment.writer}</strong>
                            <input id="comment-${comment.commentId}"
                                   value="${comment.content}"
                                   readonly>
                            ${buttons}
                        </li>
                    `);
                });
            });
        }

        function editComment(commentId) {
            $(`#comment-${commentId}`).prop('readonly', false);
            $(`#save-${commentId}`).show();
        }

        function saveEdit(commentId) {
            const content = $(`#comment-${commentId}`).val().trim();

            $.ajax({
                type: 'PUT',
                url: `/api/comments/${commentId}`,
                contentType: 'application/json',
                data: JSON.stringify({
                    content: content
                }),
                success: function () {
                    alert('댓글 수정 완료');
                    loadComments();
                },
                error: function () {
                    alert('댓글 수정 실패');
                }
            });
        }

        function deleteComment(commentId) {
            if (!confirm('댓글을 삭제하시겠습니까?')) return;

            $.ajax({
                type: 'DELETE',
                url: `/api/comments/${commentId}`,
                success: function () {
                    alert('댓글 삭제 완료');
                    loadComments();
                },
                error: function () {
                    alert('댓글 삭제 실패');
                }
            });
        }

        $(document).ready(function () {
            loadComments();
        });

        $('#wishlist-btn').click(function () {
            const loggedIn = $(this).attr('data-logged-in') === 'true';

            if (!loggedIn) {
                alert('로그인 후 이용할 수 있습니다.');
                openLoginModal();
                return;
            }

            $.ajax({
                type: 'POST',
                url: `/wishlist/toggle/${productId}`,
                success: function (result) {
                    $('#heart-icon').text(result.wished ? '♥' : '♡');
                    $('#wishlist-count').text(result.wishlistCount);
                },
                error: function () {
                    alert('찜 처리에 실패했습니다.');
                }
            });
        });

        function moveProductImages(direction) {
            const imageArea = document.getElementById('productImageArea');

            imageArea.scrollBy({
                left: imageArea.clientWidth * direction,
                behavior: 'smooth'
            });
        }

        function openProductReport() {
            document.getElementById('productReportModal').style.display = 'flex';
        }

        function closeProductReport() {
            document.getElementById('productReportModal').style.display = 'none';
        }

        function openCommentReport(commentId, writer, content) {
            document.getElementById('commentReportForm').action =
                '/report/comment/' + commentId;

            document.getElementById('reportProductId').value = productId;
            document.getElementById('reportCommentWriter').textContent = writer;
            document.getElementById('reportCommentContent').textContent = content;

            document.getElementById('commentReportModal').style.display = 'flex';
        }

        function closeCommentReport() {
            document.getElementById('commentReportModal').style.display = 'none';
        }
    </script>

    <div class="report-modal-wrapper" id="productReportModal">
        <th:block th:replace="~{report/product-report :: productReport}"></th:block>
    </div>

    <div class="report-modal-wrapper" id="commentReportModal">
        <th:block th:replace="~{report/comment-report :: commentReport}"></th:block>
    </div>

</body>

</html>
