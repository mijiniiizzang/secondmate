<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/head :: commonHead}"></th:block>
    <title>상품 수정</title>
</head>
<body>
    <div th:replace="~{common/header :: header}"></div>
    <h1>상품 수정</h1>
    <form th:action="@{/product/edit}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="productId" th:value="${product.productId}">
        <p>제목 : <input type="text" name="title" th:value="${product.title}"></p>
        <p>상품명 : <input type="text" name="name" th:value="${product.name}"></p>
        <p>작성자 : <span th:value="${product.writer}"></span></p>
    </form>
</body>
</html>
